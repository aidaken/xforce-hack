<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpaca house · Reading reward</title><style>body{font:17px/1.7 system-ui,sans-serif;max-width:620px;margin:65px auto;padding:24px;color:#284c40;background:#f5f8ee}h1{font-size:30px;line-height:1.3}button{font:inherit;padding:12px 18px;background:#285d4c;color:white;border:0;border-radius:8px;cursor:pointer}small{display:block;font-size:13px;color:#687a65;margin-top:16px}</style></head><body><h1>The Italian Renaissance</h1><p>You’ve reached the end of your reading.</p><button id="finish">Finish reading · demo</button><p id="result" role="status"></p><small>This demo uses a prepared alpaca portrait.</small><script src="alpaca-house.js" defer></script><alpaca-house open storage-key="unfold-alpaca-house-v1"></alpaca-house><script>document.querySelector('#finish').onclick=async()=>{const button=document.querySelector('#finish');button.disabled=true;try{await customElements.whenDefined('alpaca-house');const house=document.querySelector('alpaca-house');await house.completeReading({id:'italian-renaissance-chapter',title:'The Italian Renaissance',topic:'Italian Renaissance'});house.open();document.querySelector('#result').textContent=''}catch(error){document.querySelector('#result').textContent=error.message}finally{button.disabled=false}};</script></body></html>
