<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADDY — remake a passage</title>
    <meta name="theme-color" content="#efe6d4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OpenDyslexic";
        src: url("https://cdn.jsdelivr.net/gh/antijingoist/opendyslexic@0.91.12/compiled/OpenDyslexic-Regular.woff")
          format("woff");
        font-display: swap;
      }

      :root {
        --paper: #efe6d4;
        --ink: #172033;
        --muted: #4d5a6a;
        --rule: #cbbfa8;
        --accent: #0c5d47;
        --adhd: #ff7a45;
        --ball: #f2c14e;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Lexend", Verdana, sans-serif;
        letter-spacing: 0.01em;
      }
      body[data-learner="dyslexia"] {
        font-family: "OpenDyslexic", "Atkinson Hyperlegible", Verdana, sans-serif;
        font-size: 1.15rem;
        letter-spacing: 0.04em;
        word-spacing: 0.14em;
        line-height: 1.7;
        background: #fbf7ee;
      }
      body[data-learner="adhd"] {
        background: #f6efe0;
      }

      .shell {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        height: 100%;
        max-width: 920px;
        margin: 0 auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 1.2rem;
        border-bottom: 1px solid var(--rule);
      }
      .mark {
        font-weight: 700;
        letter-spacing: -0.03em;
        text-decoration: none;
        color: inherit;
      }
      .toggle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 2px solid var(--ink);
        border-radius: 999px;
        overflow: hidden;
      }
      .toggle button {
        border: 0;
        background: transparent;
        padding: 0.55rem 1rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        color: var(--ink);
      }
      .toggle button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }
      body[data-learner="adhd"] .toggle button[aria-pressed="true"] {
        background: var(--adhd);
        color: #1a120c;
      }

      .ingest {
        padding: 0.9rem 1.2rem;
        border-bottom: 1px solid var(--rule);
        display: grid;
        gap: 0.7rem;
      }
      .drop {
        border: 2px dashed var(--rule);
        padding: 0.9rem;
        text-align: center;
        cursor: pointer;
      }
      .drop.hot {
        border-color: var(--adhd);
        background: #ffe9df;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      input,
      textarea,
      button.act {
        font: inherit;
        padding: 0.55rem 0.7rem;
        border: 1px solid var(--ink);
        background: #fffdf8;
        color: inherit;
      }
      textarea {
        width: 100%;
        min-height: 4.5rem;
        resize: vertical;
      }
      button.act {
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
        font-weight: 700;
      }
      button.act:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .samples button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--rule);
        background: transparent;
        padding: 0.35rem 0.6rem;
      }

      .log {
        overflow: auto;
        padding: 1rem 1.2rem 2rem;
        display: grid;
        gap: 0.8rem;
        align-content: start;
      }
      .bubble {
        padding: 0.8rem 0.9rem;
        border: 1px solid var(--rule);
        white-space: pre-wrap;
        max-width: 100%;
      }
      .bubble.user {
        background: #fff;
        justify-self: end;
        max-width: 80%;
      }
      body[data-learner="adhd"] .bubble.addy {
        background: #fff4ea;
        border-left: 6px solid var(--adhd);
      }
      body[data-learner="dyslexia"] .bubble.addy {
        background: #fff;
        max-width: 38rem;
      }
      .meta {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .rationale {
        font-weight: 700;
        margin-bottom: 0.4rem;
      }
      .notice {
        background: #fff3c4;
        padding: 0.5rem 0.7rem;
        font-size: 0.9rem;
      }

      form.composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem;
        padding: 0.8rem 1.2rem 1.1rem;
        border-top: 1px solid var(--rule);
      }

      .pup {
        position: fixed;
        right: 1.2rem;
        bottom: 5.5rem;
        width: 72px;
        height: 72px;
        pointer-events: none;
        z-index: 5;
      }
      body[data-learner="dyslexia"] .pup,
      body.still .pup {
        display: none;
      }
      .ball {
        position: absolute;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff6c4, var(--ball) 46%, #c98912);
        animation: bounce 0.7s ease-in-out infinite;
      }
      .dog {
        position: absolute;
        left: 18px;
        top: 18px;
        font-size: 2.4rem;
        animation: wag 0.55s ease-in-out infinite;
        transform-origin: 50% 80%;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translate(8px, 28px);
        }
        50% {
          transform: translate(8px, 0);
        }
      }
      @keyframes wag {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(10deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pup {
          display: none;
        }
      }
    </style>
  </head>
  <body data-learner="adhd">
    <div class="pup" aria-hidden="true">
      <div class="ball"></div>
      <div class="dog">🐕</div>
    </div>
    <div class="shell">
      <header>
        <a class="mark" href="/">ADDY</a>
        <div class="toggle" role="group" aria-label="Learner mode">
          <button id="btn-adhd" type="button" aria-pressed="true">ADHD</button>
          <button id="btn-dys" type="button" aria-pressed="false">Dyslexia</button>
        </div>
      </header>

      <section class="ingest">
        <div class="row samples" id="samples"></div>
        <label class="drop" id="drop">
          Drop a PDF, Word, or Google Doc file, or click to upload
          <input
            id="file"
            type="file"
            accept=".pdf,.docx,.gdoc,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"
            hidden
          />
        </label>
        <textarea id="paste" placeholder="Or paste a textbook paragraph…"></textarea>
        <div class="row">
          <input id="url" type="url" placeholder="https:// article or public Google Doc" style="flex: 1; min-width: 12rem" />
          <button class="act" id="eat" type="button">Eat & chew</button>
        </div>
        <div class="meta" id="status">No passage yet. Load a sample or drop a file.</div>
      </section>

      <div class="log" id="log"></div>

      <form class="composer" id="form">
        <input id="msg" autocomplete="off" placeholder="Ask ADDY to remake it…" />
        <button class="act" type="submit">Send</button>
      </form>
    </div>

    <script>
      const state = {
        learner: "adhd",
        document: null,
        history: [],
      };

      const $ = (id) => document.getElementById(id);
      const logEl = $("log");

      function setLearner(learner) {
        state.learner = learner;
        document.body.dataset.learner = learner;
        $("btn-adhd").setAttribute("aria-pressed", String(learner === "adhd"));
        $("btn-dys").setAttribute("aria-pressed", String(learner === "dyslexia"));
      }

      $("btn-adhd").onclick = () => setLearner("adhd");
      $("btn-dys").onclick = () => setLearner("dyslexia");

      function addBubble(role, text, extra = {}) {
        const div = document.createElement("div");
        div.className = `bubble ${role === "user" ? "user" : "addy"}`;
        if (extra.rationale) {
          const r = document.createElement("div");
          r.className = "rationale";
          r.textContent = extra.rationale;
          div.appendChild(r);
        }
        const pre = document.createElement("div");
        pre.textContent = text;
        div.appendChild(pre);
        if (extra.notice) {
          const n = document.createElement("div");
          n.className = "notice";
          n.textContent = extra.notice;
          div.appendChild(n);
        }
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      }

      async function api(path, body, method = "GET") {
        const res = await fetch(path, {
          method,
          headers: body ? { "Content-Type": "application/json" } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || res.statusText);
        return data;
      }

      async function loadSamples() {
        const data = await api("/api/samples");
        const wrap = $("samples");
        wrap.innerHTML = "";
        for (const sample of data.samples) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = sample.title.split("—")[0].trim();
          btn.onclick = () => ingest({ type: "sample", sampleId: sample.id });
          wrap.appendChild(btn);
        }
      }

      async function ingest(payload) {
        $("status").textContent = "Chewing…";
        try {
          const data = await api("/api/ingest", payload, "POST");
          state.document = data.document;
          state.history = [];
          logEl.innerHTML = "";
          $("status").textContent = `${data.document.title} · ${data.document.conceptType.replace("_", " ")} · ${data.document.charCount} chars`;
          addBubble("addy", data.document.excerpt, {
            rationale: data.document.plannerRationale,
          });
        } catch (err) {
          $("status").textContent = err.message;
        }
      }

      $("eat").onclick = async () => {
        const url = $("url").value.trim();
        const text = $("paste").value.trim();
        if (url) return ingest({ type: "url", url });
        if (text) return ingest({ type: "text", text });
        $("status").textContent = "Paste text, drop a file, or add a URL.";
      };

      const drop = $("drop");
      const file = $("file");
      drop.onclick = () => file.click();
      drop.ondragover = (e) => {
        e.preventDefault();
        drop.classList.add("hot");
      };
      drop.ondragleave = () => drop.classList.remove("hot");
      drop.ondrop = (e) => {
        e.preventDefault();
        drop.classList.remove("hot");
        if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
      };
      file.onchange = () => {
        if (file.files[0]) readFile(file.files[0]);
      };

      function ingestTypeFor(name) {
        const lower = String(name || "").toLowerCase();
        if (lower.endsWith(".docx")) return "docx";
        if (lower.endsWith(".gdoc")) return "gdoc";
        if (lower.endsWith(".txt") || lower.endsWith(".md")) return "text";
        return "pdf";
      }

      function readFile(blob) {
        const type = ingestTypeFor(blob.name);
        const reader = new FileReader();
        if (type === "gdoc" || type === "text") {
          reader.onload = () => {
            ingest({ type, filename: blob.name, text: String(reader.result || "") });
          };
          reader.readAsText(blob);
          return;
        }
        reader.onload = () => {
          ingest({
            type,
            filename: blob.name,
            base64: String(reader.result).split(",")[1] || reader.result,
          });
        };
        reader.readAsDataURL(blob);
      }

      $("form").onsubmit = async (e) => {
        e.preventDefault();
        const message = $("msg").value.trim();
        if (!message) return;
        if (!state.document) {
          $("status").textContent = "Ingest a passage first.";
          return;
        }
        $("msg").value = "";
        addBubble("user", message);
        state.history.push({ role: "user", content: message });
        try {
          const data = await api(
            "/api/chat",
            {
              learner: state.learner,
              message,
              documentId: state.document.id,
              document: state.document,
              history: state.history,
            },
            "POST",
          );
          addBubble("addy", data.text, {
            rationale: data.rationale,
            notice: data.notice,
          });
          state.history.push({ role: "assistant", content: data.text });
        } catch (err) {
          addBubble("addy", err.message);
        }
      };

      loadSamples().catch((err) => {
        $("status").textContent = err.message;
      });
    </script>
  </body>
</html>
